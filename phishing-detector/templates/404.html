{% extends "base.html" %}
{% block title %}404 — Not Found{% endblock %}
{% block content %}
<div class="container text-center py-5">
  <div style="font-size:4rem; color:var(--neon-blue); opacity:.3;">
    <i class="bi bi-question-circle"></i>
  </div>
  <h2 class="fw-bold mt-3 text-neon-blue">404 — Page Not Found</h2>
  <p class="text-secondary">The page you are looking for does not exist.</p>
  <a href="{{ url_for('index') }}" class="btn btn-analyze mt-2">
    <i class="bi bi-house me-1"></i> Return Home
  </a>
</div>
{% endblock %}
